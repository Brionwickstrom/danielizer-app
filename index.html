<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Danielizer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(160deg,#1a1a2e,#16213e,#0f3460); color:#fff; min-height:100vh; padding:16px; }
  h1 { text-align:center; font-size:1.8rem; margin:8px 0 4px; letter-spacing:1px; }
  .sub { text-align:center; color:#8fa3c1; font-size:.9rem; margin-bottom:18px; }
  .card { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:14px; margin-bottom:14px; backdrop-filter:blur(6px); }
  .card h2 { font-size:1rem; margin-bottom:10px; color:#ffd166; }
  button { cursor:pointer; border:none; border-radius:12px; padding:10px 14px; font-size:.95rem; font-weight:600; transition:transform .1s; }
  button:active { transform:scale(.96); }
  .btn-primary { background:#e94560; color:#fff; width:100%; margin-top:8px; }
  .btn-ghost { background:rgba(255,255,255,.12); color:#fff; }
  .kids { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .kid { padding:8px 14px; border-radius:20px; background:rgba(255,255,255,.1); color:#cfd8e3; font-weight:600; }
  .kid.on { background:#e94560; color:#fff; box-shadow:0 0 12px rgba(233,69,96,.6); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .day { text-align:center; font-size:.7rem; color:#8fa3c1; padding-bottom:4px; }
  .slot { aspect-ratio:1; border-radius:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); font-size:.65rem; display:flex; align-items:center; justify-content:center; color:#6b7c93; }
  .slot.free { background:#2ecc71; color:#fff; border-color:#2ecc71; }
  .slot.busy { background:#e74c3c; color:#fff; border-color:#e74c3c; }
  .overlap { background:#ffd166; color:#1a1a2e; border-color:#ffd166; font-weight:700; }
  .chat { height:180px; overflow-y:auto; background:rgba(0,0,0,.25); border-radius:12px; padding:10px; margin-bottom:10px; font-size:.85rem; }
  .msg { margin-bottom:8px; line-height:1.4; }
  .msg b { color:#ffd166; }
  .msg.me b { color:#e94560; }
  input[type=text] { width:100%; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.3); color:#fff; font-size:.9rem; margin-bottom:8px; }
  .stickers { display:flex; gap:8px; flex-wrap:wrap; }
  .sticker { font-size:1.6rem; background:rgba(255,255,255,.08); border-radius:12px; padding:6px 10px; }
  .pts { color:#ffd166; font-weight:700; }
  .demo-tag { display:inline-block; background:#ffd166; color:#1a1a2e; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  @media (min-width:600px){ body{max-width:520px;margin:0 auto;} }
</style>
</head>
<body>
<h1>The Danielizer <span class="demo-tag">DEMO</span></h1>
<p class="sub">Tap a friend, mark when you're free, find hangout time</p>

<div class="card">
  <h2>Who's here?</h2>
  <div class="kids" id="kids"></div>
  <button class="btn-primary" onclick="checkIn()">Check in today +1 sticker</button>
</div>

<div class="card">
  <h2>This week — tap to toggle free/busy</h2>
  <div class="grid" id="grid"></div>
</div>

<div class="card">
  <h2>Overlap</h2>
  <div id="overlap">Pick a friend to compare times.</div>
</div>

<div class="card">
  <h2>Hangout chat</h2>
  <div class="chat" id="chat"></div>
  <input type="text" id="msg" placeholder="Type something..." onkeydown="if(event.key==='Enter')send()">
  <button class="btn-ghost" onclick="send()">Send</button>
</div>

<div class="card">
  <h2>Sticker collection</h2>
  <div class="stickers" id="stickers"></div>
  <p style="margin-top:8px;font-size:.85rem">Total: <span class="pts" id="total">0</span> points</p>
</div>

<script>
const NAMES = ['Daniel','Maya','Leo','Sofia','Ava'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const state = {};
NAMES.forEach(n => state[n] = { slots: Array(49).fill(0), stickers: 0, points: 0 });
state['Maya'].slots = state['Maya'].slots.map((_,i)=> i%5===0||i%7===2?1:0);
state['Leo'].slots = state['Leo'].slots.map((_,i)=> i%4===1?1:0);
state['Sofia'].slots = state['Sofia'].slots.map((_,i)=> i%6===3?1:0);
state['Ava'].slots = state['Ava'].slots.map((_,i)=> i%3===0?1:0);
let me = 'Daniel';
const EMOJIS = ['⭐','🚀','🎮','🏆','💎','🔥','🌈','🦄'];

function renderKids(){
  const el = document.getElementById('kids);
  el.innerHTML = '';
  NAMES.forEach(n => {
    const b = document.createElement('button);
    b.className = 'kid' + (n===me?' on':'');
    b.textContent = n;
    b.onclick = () => { me = n; renderKids(); renderGrid(); renderOverlap(); };
    el.appendChild(b);
  });
}
function renderGrid(){
  const g = document.getElementById('grid);
  g.innerHTML = '';
  DAYS.forEach(d => { const x=document.createElement('div'); x.className='day'; x.textContent=d; g.appendChild(x); });
  for(let i=0;i<49;i++){
    const s = document.createElement('div);
    s.className = 'slot' + (state[me].slots[i]===1?' free': state[me].slots[i]===2?' busy':'');
    s.textContent = state[me].slots[i]===1?'✓': state[me].slots[i]===2?'✗':'';
    s.onclick = () => { state[me].slots[i] = state[me].slots[i]===1?2:1; renderGrid(); renderOverlap(); };
    g.appendChild(s);
  }
}
function renderOverlap(){
  const others = NAMES.filter(n=>n!==me);
  let html = '<div class="kids">';
  others.forEach(n => html += '<button class="kid" onclick="showOverlap(\''+n+'\')">'+n+'</button>');
  html += '</div><p style="font-size:.8rem;color:#8fa3c1;margin-top:6px">Green = you, yellow = both free</p>';
  document.getElementById('overlap').innerHTML = html;
}
function showOverlap(n){
  let html = '<b>You vs '+n+':</b><div class="grid">';
  DAYS.forEach(d => { const x=document.createElement('div'); x.className='day'; x.textContent=d; html+=x.outerHTML; });
  for(let i=0;i<49;i++){
    const a=state[me].slots[i], b=state[n].slots[i];
    let c='slot'; if(a===1&&b===1)c+=' overlap'; else if(a===1)c+=' free'; else if(b===1)c+=' free';
    html += '<div class="'+c+'">'+(a===1&&b===1?'★':'')+'</div>';
  }
  html += '</div>';
  document.getElementById('overlap').innerHTML = html + '<button class="btn-primary" style="margin-top:10px" onclick="renderOverlap()">Back</button>';
}
function checkIn(){
  state[me].stickers++; state[me].points += 10;
  addMsg('system', me + ' checked in and earned a sticker! 🎉);
  renderStickers();
}
function renderStickers(){
  const el = document.getElementById('stickers);
  el.innerHTML = '';
  for(let i=0;i<state[me].stickers;i++) el.innerHTML += '<span class="sticker">'+EMOJIS[i%EMOJIS.length]+'</span>';
  document.getElementById('total').textContent = state[me].points;
}
function addMsg(who, text){
  const c = document.getElementById('chat);
  const d = document.createElement('div);
  d.className = 'msg' + (who===me?' me':'');
  d.innerHTML = '<b>'+who+':</b> '+text;
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function send(){
  const inp = document.getElementById('msg);
  if(!inp.value.trim()) return;
  addMsg(me, inp.value.trim()); inp.value='';
}
addMsg('Maya','Soccer field Saturday?);
addMsg('Leo','I can do 2pm);
addMsg('Sofia','Yesss);
renderKids(); renderGrid(); renderOverlap(); renderStickers();
</script>
</body>
</html>
